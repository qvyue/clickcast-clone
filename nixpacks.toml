# Nixpacks 配置文件
# Railway 使用 Nixpacks 构建

[start]
cmd = "bash scripts/start.sh"

[install]
# Skip — browsers are installed at runtime via entrypoint.sh to persistent /data/browsers
# Do NOT install here: this runs during build, /data doesn't exist yet, and it downloads every time

[variables]
# 确保 Node.js 使用正确内存
NODE_OPTIONS = "--max-old-space-size=768"